name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Build backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build
        working-directory: kawahputih/backend
        run: go build ./...

      - name: Vet
        working-directory: kawahputih/backend
        run: go vet ./...

  frontend:
    name: Build frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: kawahputih/frontend
        run: npm ci

      - name: Build
        working-directory: kawahputih/frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
        run: npm run build
